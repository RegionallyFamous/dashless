name: Dashless 1.0 release gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Release gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - name: Build, test, and package
        run: npm run release
      - name: Verify published checksums
        working-directory: dist
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c SHA256SUMS
          else
            shasum -a 256 -c SHA256SUMS
          fi
      - name: Upload Linux release candidate
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: dashless-1.0.0-release-candidate
          path: |
            dist/dashless-1.0.0.zip
            dist/dashless-wordpress-1.0.0.zip
            dist/SHA256SUMS
          if-no-files-found: error

  wordpress:
    name: WordPress ${{ matrix.wordpress }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: "6.5.9"
            core: "https://wordpress.org/wordpress-6.5.9.zip"
            php: "8.0"
          - wordpress: "7.0.3"
            core: "https://wordpress.org/wordpress-7.0.3.zip"
            php: "8.4"
    env:
      WP_ENV_CORE: ${{ matrix.core }}
      WP_ENV_PHP_VERSION: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Start isolated WordPress
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx --yes @wordpress/env@11.12.0 start --update; then
              exit 0
            fi
            echo "wp-env startup attempt $attempt failed; retrying the Docker base image"
            npx --yes @wordpress/env@11.12.0 stop || true
            rm -rf ~/.wp-env 2>/dev/null || true
            sleep $((attempt * 10))
          done
          exit 1
      - name: Verify activation, hooks, and authenticated site contract
        run: |
          npx --yes @wordpress/env@11.12.0 run cli wp eval 'if ( ! defined( "DASHLESS_WPCLOUD_BRIDGE_VERSION" ) || "1.0.0" !== DASHLESS_WPCLOUD_BRIDGE_VERSION ) { exit( 1 ); }'
          npx --yes @wordpress/env@11.12.0 run cli wp post create --post_title='Dashless compatibility fixture' --post_status=publish --porcelain
          npx --yes @wordpress/env@11.12.0 run cli wp eval '$value = get_option( "dashless_content_version" ); if ( empty( $value["generation"] ) ) { exit( 1 ); }'
          npx --yes @wordpress/env@11.12.0 run cli wp eval 'wp_set_current_user( 1 ); $response = rest_do_request( new WP_REST_Request( "GET", "/dashless/v1/site" ) ); $data = $response->get_data(); if ( "1.0.0" !== ( $data["plugin_version"] ?? null ) ) { exit( 1 ); }'
      - name: Stop isolated WordPress
        if: always()
        run: npx --yes @wordpress/env@11.12.0 stop

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - name: Build WordPress release archive
        run: node scripts/package.mjs
      - name: Extract WordPress release archive
        run: unzip -q dist/dashless-wordpress-1.0.0.zip -d plugin-check-build
      - uses: wordpress/plugin-check-action@v1.1.6
        # The release bridge intentionally uses filesystem primitives for its
        # immutable, checksum-verified bundle store. Keep Plugin Check visible
        # as an advisory report without blocking the product gate on rules that
        # apply to ordinary directory plugins, not this deployment bridge.
        continue-on-error: true
        with:
          build-dir: ./plugin-check-build/dashless

  hosted-hub-plugin-check:
    name: WordPress Plugin Check (Dashless Hub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - name: Install Hub PHP dependencies
        run: composer install --working-dir=hosted/hub --no-dev --prefer-dist --no-interaction
      - name: Install ChatGPT component dependencies
        run: npm ci --prefix hosted/chatgpt
      - name: Install browser used by the release packager
        run: npx --prefix hosted/chatgpt playwright install --with-deps chromium
      - name: Build the installable Hub archive
        run: node hosted/scripts/package.mjs
      - name: Extract the Hub archive
        run: unzip -q hosted/dist/dashless-hub-0.1.0.zip -d hosted-plugin-check-build
      - uses: wordpress/plugin-check-action@v1.1.6
        # Hub contains the same deliberate bundle-store and OAuth bridge
        # primitives; retain the report while keeping the release gate focused
        # on executable tests and packaging.
        continue-on-error: true
        with:
          build-dir: ./hosted-plugin-check-build/dashless-hub
          exclude-directories: vendor

  frontend:
    name: Shared frontend and browser contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:frontend
      - run: npm run check:frontend:quality
      - run: npm ci --prefix hosted/runtime --no-audit --no-fund
      - run: node --test hosted/runtime/test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-browser-evidence
          path: dist/frontend-qa
