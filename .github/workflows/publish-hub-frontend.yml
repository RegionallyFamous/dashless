name: Publish Hub Astro frontend

on:
  push:
    branches: [main]
    paths:
      - 'hosted/hub-frontend/**'
      - 'hosted/scripts/publish-hub-release.mjs'
      - 'hosted/scripts/make-hub-release.mjs'
      - 'hosted/scripts/cleanup-hub-releases.mjs'
      - 'hosted/scripts/check-hub-frontend.mjs'
      - 'hosted/scripts/build-theme-demos.mjs'
      - 'config/**'
      - 'package.json'
      - 'package-lock.json'
      - 'templates/astro/**'
      - 'examples/small-problems/**'
      - 'wordpress/hosted/theme-previews/**'
      - 'wordpress/dashless-wpcloud.php'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashless-hub-frontend-production
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ vars.DASHLESS_RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix hosted/hub-frontend --ignore-scripts --no-audit --no-fund
      - name: Install WP Cloud SSH key and host trust
        env:
          SSH_KEY: ${{ secrets.WPCLOUD_SSH_KEY }}
          SSH_HOST: ${{ secrets.WPCLOUD_SSH_HOST || 'sftp.wp.com' }}
          SSH_PORT: ${{ secrets.WPCLOUD_SSH_PORT || 22 }}
          KEY_PATH: ${{ runner.temp }}/dashless-hub-id_ed25519
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Build, activate, verify, and clean the canonical Hub release
        env:
          DASHLESS_RELEASE_ORIGIN: ${{ vars.DASHLESS_RELEASE_ORIGIN || 'https://dashless.blog' }}
          DASHLESS_HUB_SSH_KEY: ${{ runner.temp }}/dashless-hub-id_ed25519
          DASHLESS_HUB_SSH_TARGET: ${{ secrets.WPCLOUD_SSH_USER || 'dashlessdeploy' }}@${{ secrets.WPCLOUD_SSH_HOST || 'sftp.wp.com' }}
          DASHLESS_HUB_SSH_PORT: ${{ secrets.WPCLOUD_SSH_PORT || 22 }}
          DASHLESS_HUB_REMOTE_ROOT: /htdocs/wp-content/uploads/dashless/releases
        run: npm run publish:hub
